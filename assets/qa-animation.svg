<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="auto">
  <defs>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.05); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes moveLine {
        0% { transform: translateY(0); opacity: 0; }
        5% { opacity: 1; }
        95% { opacity: 1; }
        100% { transform: translateY(180px); opacity: 0; }
      }
      @keyframes progressBar {
        0% { width: 0%; }
        70% { width: 100%; }
        100% { width: 100%; }
      }
      @keyframes showCheck {
        0%, 70% { opacity: 0; transform: scale(0.5); }
        80% { opacity: 1; transform: scale(1.2); }
        90%, 100% { opacity: 1; transform: scale(1); }
      }
      @keyframes bugToCheck {
        0%, 40% { opacity: 1; transform: scale(1); }
        50%, 100% { opacity: 0; transform: scale(0); }
      }
      @keyframes checkPop {
        0%, 45% { opacity: 0; transform: scale(0); }
        55% { opacity: 1; transform: scale(1.2); }
        65%, 100% { opacity: 1; transform: scale(1); }
      }
      .bg { fill: #0f172a; }
      .code-text { font-family: 'Consolas', 'Fira Code', monospace; font-size: 13px; fill: #e2e8f0; }
      .code-green { fill: #4ade80; }
      .code-yellow { fill: #facc15; }
      .code-blue { fill: #38bdf8; }
      .scan-line { animation: moveLine 4s infinite linear; stroke: #38bdf8; stroke-width: 2; opacity: 0.7; }
      .progress-fill { animation: progressBar 4s infinite ease-in-out; }
      .check-status { animation: showCheck 4s infinite ease-in-out; transform-origin: 20px 125px; }
      .bug-icon { animation: bugToCheck 4s infinite ease-in-out; transform-origin: 150px 125px; }
      .check-icon { animation: checkPop 4s infinite ease-in-out; transform-origin: 150px 125px; }
      .radar-circle { animation: pulse 2s infinite ease-in-out; transform-origin: 150px 125px; }
      .radar-circle-2 { animation: pulse 2s infinite ease-in-out; animation-delay: 1s; transform-origin: 150px 125px; }
    </style>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="250" rx="12" class="bg" />

  <!-- Code Console Window (Left) -->
  <g transform="translate(40, 35)">
    <!-- Window header -->
    <rect width="420" height="180" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="15" r="6" fill="#ef4444" />
    <circle cx="40" cy="15" r="6" fill="#f59e0b" />
    <circle cx="60" cy="15" r="6" fill="#10b981" />
    <text x="90" y="19" font-family="'Consolas', monospace" font-size="11" fill="#64748b">vaibhavihire-qa-terminal.sh</text>

    <!-- Console Text -->
    <g transform="translate(20, 50)">
      <text x="0" y="0" class="code-text"><tspan class="code-yellow">vaibhavi@hire</tspan>:<tspan class="code-blue">~/qa-automation</tspan>$ npm run test:all</text>
      
      <text x="0" y="25" class="code-text" fill="#94a3b8">> Executing Playwright &amp; Selenium Test Suites...</text>
      
      <!-- Progress Bar Container -->
      <rect x="0" y="42" width="250" height="8" rx="4" fill="#334155" />
      <!-- Animated Progress Fill -->
      <rect x="0" y="42" width="0" height="8" rx="4" fill="#38bdf8" class="progress-fill" />
      
      <text x="0" y="70" class="code-text" fill="#94a3b8">Running: <tspan class="code-blue">UserAuthenticationFlow.spec.java</tspan></text>
      <text x="0" y="90" class="code-text" fill="#94a3b8">Running: <tspan class="code-blue">ProductCheckoutIntegration.spec.java</tspan></text>
      
      <!-- Results Checkmark -->
      <g class="check-status">
        <text x="0" y="120" class="code-text code-green">✔ 120 tests passed (100% success rate)</text>
        <text x="0" y="140" class="code-text" fill="#94a3b8">Time: <tspan class="code-yellow">12.45s</tspan>, Regression Cycle: <tspan class="code-green">-20%</tspan></text>
      </g>
    </g>
  </g>

  <!-- Animated Scanner Graphics (Right) -->
  <g transform="translate(500, 0)">
    <!-- Scanning radar line -->
    <line x1="20" y1="35" x2="280" y2="35" class="scan-line" />
    <line x1="20" y1="35" x2="280" y2="35" class="scan-line" style="animation-delay: 2s;" />

    <!-- QA Radar Circle -->
    <circle cx="150" cy="125" r="60" fill="none" stroke="#1e293b" stroke-width="2" />
    <circle cx="150" cy="125" r="40" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="150" cy="125" r="80" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2" />
    
    <!-- Pulsing glow rings -->
    <circle cx="150" cy="125" r="60" fill="none" stroke="#38bdf8" stroke-width="1.5" class="radar-circle" filter="url(#glow)" />
    <circle cx="150" cy="125" r="80" fill="none" stroke="#a78bfa" stroke-width="1.5" class="radar-circle-2" filter="url(#glow)" />

    <!-- Animated Icons (Bug transforming to Check) -->
    <!-- Bug Icon (Visible in first 40% of animation) -->
    <g class="bug-icon">
      <!-- Bug body -->
      <rect x="135" y="110" width="30" height="30" rx="15" fill="#f87171" filter="url(#glow)" />
      <!-- Legs -->
      <line x1="125" y1="115" x2="135" y2="120" stroke="#f87171" stroke-width="3" stroke-linecap="round" />
      <line x1="125" y1="125" x2="135" y2="125" stroke="#f87171" stroke-width="3" stroke-linecap="round" />
      <line x1="125" y1="135" x2="135" y2="130" stroke="#f87171" stroke-width="3" stroke-linecap="round" />
      
      <line x1="175" y1="115" x2="165" y2="120" stroke="#f87171" stroke-width="3" stroke-linecap="round" />
      <line x1="175" y1="125" x2="165" y2="125" stroke="#f87171" stroke-width="3" stroke-linecap="round" />
      <line x1="175" y1="135" x2="165" y2="130" stroke="#f87171" stroke-width="3" stroke-linecap="round" />
      <!-- Antennae -->
      <path d="M 143 110 Q 140 100 135 98" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" />
      <path d="M 157 110 Q 160 100 165 98" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" />
      
      <circle cx="150" cy="125" r="4" fill="#1e293b" />
    </g>

    <!-- Checkmark Icon (Pops up in second half of animation) -->
    <g class="check-icon">
      <circle cx="150" cy="125" r="28" fill="#4ade80" filter="url(#glow)" />
      <path d="M 140 125 L 147 132 L 162 117" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    
    <text x="150" y="215" font-family="'Consolas', monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#38bdf8" letter-spacing="1">QA PIPELINE VERIFIED</text>
  </g>
</svg>
